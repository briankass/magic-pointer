{
"name": "Compile Portable Windows EXE",
"on": "push",
"jobs": {
"build": {
"runs-on": "windows-latest",
"steps": [
{
"name": "Checkout repository",
"uses": "actions/checkout@v4"
},
{
"name": "Install Rust Stable",
"uses": "dtolnay/rust-toolchain@stable"
},
{
"name": "Build Standalone WebView2 EXE",
"shell": "cmd",
"run": "mkdir src 2>nul & if exist index.html (copy /Y index.html src\index.html) & if not exist src\index.html (echo MagicPointer > src\index.html) & echo W3BhY2thZ2VdCm5hbWUgPSAiTWFnaWMtUG9pbnRlciIKdmVyc2lvbiA9ICIxLjAuMCIKZWRpdGlvbiA9ICIyMDIxIgoKW2RlcGVuZGVuY2llc10KdGFvID0gIjAuMzAuOCIKd3J5ID0gIjAuNDcuMiIK > cargo.b64 & certutil -f -decode cargo.b64 Cargo.toml & echo  > main.b64 & certutil -f -decode main.b64 src\main.rs & cargo build --release"
},
{
"name": "Upload Portable EXE",
"uses": "actions/upload-artifact@v4",
"with": {
"name": "Magic-Pointer-Portable-EXE",
"path": "target/release/Magic-Pointer.exe"
}
}
]
}
}
}
