{
"name": "Compile Portable Windows EXE",
"on": "push",
"jobs": {
"build": {
"runs-on": "windows-latest",
"steps": [
{
"name": "Checkout repository",
"uses": "actions/checkout@v4"
},
{
"name": "Install Rust Stable",
"uses": "dtolnay/rust-toolchain@stable"
},
{
"name": "Build Standalone WebView2 EXE",
"shell": "cmd",
"run": "mkdir src 2>nul & if exist index.html (copy /Y index.html src\index.html) & if not exist src\index.html (echo ^<h1^>Magic Pointer^</h1^> > src\index.html) & echo W3BhY2thZ2VdCm5hbWUgPSAvbWFnaWMtcG9pbnRlci8KdmVyc2lvbiA9IC8xLjAuMC8KZWRpdGlvbiA9IC8yMDIxLwokW2RlcGVuZGVuY2llc10KdGFvID0gLzAuMzAuOC8Kd3J5ID0gLzAuNDcuMi8K > cargo.b64 & certutil -decode cargo.b64 Cargo.toml & powershell -Command (Get-Content Cargo.toml).Replace('/','"').Replace('$','') > Cargo2.toml & move /Y Cargo2.toml Cargo.toml & echo IyFbwindows_subsystem =  > main.b64 & certutil -decode main.b64 src\main.rs & powershell -Command (Get-Content src\main.rs).Replace('/','"') > src\main2.rs & move /Y src\main2.rs src\main.rs & cargo build --release"
},
{
"name": "Upload Portable EXE",
"uses": "actions/upload-artifact@v4",
"with": {
"name": "Magic-Pointer-Portable-EXE",
"path": "target/release/magic-pointer.exe"
}
}
]
}
}
}
